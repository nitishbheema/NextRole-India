name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        working-directory: backend
        run: |
          chmod +x ./mvnw
          if ! ./mvnw test --no-transfer-progress -l maven-build.log; then
            cat maven-build.log
            grep -E "\[ERROR\]" maven-build.log | while read -r line; do
              echo "::error title=Maven Error::$line"
            done
            for f in target/surefire-reports/*.txt; do
              if [ -f "$f" ]; then
                msg=$(head -n 20 "$f" | tr '\n' ' ')
                echo "::error file=$f,title=Test Failure::$msg"
              fi
            done
            exit 1
          fi
        env:
          SPRING_PROFILES_ACTIVE: test

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://placeholder.onrender.com

  backend-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: backend
        run: docker build -t nextrole-backend:${{ github.sha }} .
