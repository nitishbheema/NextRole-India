spring:
  application:
    name: nextrole-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nextrole}
    username: ${DATABASE_USERNAME:nextrole}
    password: ${DATABASE_PASSWORD:nextrole}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme}
  sync:
    http-timeout-seconds: 30
    read-timeout-seconds: 60
    max-retries: 3
    retry-delay-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.nextrole: INFO
    org.springframework.security: WARN
