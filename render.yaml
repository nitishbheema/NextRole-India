services:
  # ── NextRole India Backend (Docker Web Service on Render Free Tier) ────────
  - type: web
    name: nextrole-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── NextRole India Frontend (Static Site on Render Free Tier) ──────────────
  - type: static
    name: nextrole-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nextrole-api-8fob.onrender.com
    routes:
      # SPA fallback rewrite: intercepts all non-asset routes on page refresh and serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
